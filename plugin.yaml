name: antemuse
label: Antemuse
kind: standalone
manifest_version: 2
version: "0.10.44"
author: Antemuse
homepage: https://antemuse.com
license: MIT
tags: [state, cognition, workflow, creativity]
platforms: [linux, macos, windows]
description: "The agent takes a walk, daydreams, dreams, doomscrolls, or gets unstuck: a bounded change to how it works, with a dose rather than a duration. Walks step through WordNet, dreams recombine FrameNet roles, daydreams draw on stored memories, doomscrolls on live feeds. No model calls on the state path."
requires_hermes: ">=0.21.6"
python_dependencies:
  - "nltk>=3.8,<4"
# Settings the Hermes desktop app renders as a form (Settings ▸ Plugins ▸ Antemuse,
# from this schema) and writes to plugins.entries.antemuse.settings.<key>.
# A setting may change how loud or how long a state is; it may not change what a state is.
config_schema:
  recommend_enabled:
    type: bool
    default: true
    label: Recommend states
    description: >-
      Let the plugin suggest a state when the shape of the work has a name (a loop,
      a data wall, a long stretch). Off means silence: nothing is suggested, ever.
  show_recommendations:
    type: bool
    default: false
    label: Show recommendations
    description: >-
      Display a suggested state when the shape of the work has a name (a loop, a
      data wall, a long stretch). Off by default: states are measured either way,
      but nothing is suggested to the person and nothing is offered to the agent.
      /break still works and still names no state unless this is on.
  recommend_cooling_turns:
    type: int
    default: 10
    min: 2
    max: 60
    label: Turns between recommendations
    description: >-
      How many turns one recommendation holds before another may replace it, counted
      in turns rather than minutes. Below 2 is clamped to 2, above 60 to 60: a plugin
      that speaks every turn is a nag.
  suggest_autofollow:
    type: bool
    default: false
    label: Follow suggestions automatically
    description: >-
      When the plugin suggests a state, enter it instead of only saying so. Off by
      default: a suggestion is advice, and the person decides whether to act on it.
      A followed state still ends by its dose, and nothing about the move changes.
  long_stretch_turns:
    type: int
    default: 0
    min: 0
    max: 200
    label: Long-stretch threshold
    description: >-
      Turns without a state before one is recommended. 0 keeps the measured threshold
      (the 75th percentile of your own stretches, clamped 15-80). Any other value
      overrides it, and the line says "fixed at N".
  journal_cap:
    type: int
    default: 60
    min: 20
    max: 60
    label: Journal entries kept
    description: >-
      How many journal entries the state keeps. Reduce only: values above 60 are
      clamped to 60, and below 20 to 20.
  session_scan:
    type: bool
    default: true
    label: Read past sessions
    description: >-
      Let daydream and dream use recent session text as material: one bounded scan of the
      last 14 days, once per session, in a background thread. Off means the plugin never
      opens the session store, and the states fall back to memory files and feeds.
  dream_projects:
    type: string
    default: ""
    label: Projects a dream may read
    description: >-
      Which repositories dream reads for "what happened today". Empty means the project you
      are working in. For several, list them comma separated: plain names under your home
      directory, or absolute paths. The plugin reads commit subjects and changed file names
      only, never a transcript.
provides_tools:
  - state
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - transform_llm_output
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - on_session_delete
