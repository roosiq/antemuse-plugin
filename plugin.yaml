name: antemuse-states
label: Antemuse States
kind: standalone
version: "0.4.0"
author: Antemuse
homepage: https://antemuse.com
description: >
  Antemuse States lets the agent itself take a walk, daydream, dissociate,
  dream, or doomscroll. A state is a bounded change to behaviour, not a place:
  it decides which tools are still allowed, what shape the next replies take,
  and what residue the agent carries when the state ends. States expire on
  minutes and turns, are injected into the turn they govern, block forbidden
  tools before they run, and mark the reply so the human can see which state
  produced it. No network, no model calls, no scoring.
requires_hermes: ">=0.21.6"
provides_tools:
  - state
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - transform_llm_output
