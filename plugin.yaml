name: antemuse
label: Antemuse
kind: standalone
manifest_version: 2
version: "0.10.7"
author: Antemuse
homepage: https://antemuse.com
license: MIT
tags: [state, cognition, workflow, terminal, creativity]
platforms: [linux, macos, windows]
description: >
  Antemuse lets the agent itself take a walk, daydream, dream, doomscroll, or get
  unstuck. A state is a bounded change to behaviour, not a place: it shapes the
  next replies, decides what residue the agent carries when the state ends, and —
  only when the entry asks with block: true — restricts which tools may run. By
  default a state does not interrupt the work it happens inside. A state is an act
  with a dose (six turns of work, two memory pairs, three feed items, two
  recombinations, one direction), not a duration: it ends when the dose is done,
  minutes are only a ceiling, and an expiry says how much of the dose arrived.
  Walks step through WordNet (117k synsets, named relations) and dreams recombine
  FrameNet roles (1,221 frames); daydreams draw on stored memories, doomscrolls on
  live feeds. No model calls, no scoring on the state path.
requires_hermes: ">=0.21.6"
python_dependencies:
  - "pillow>=10,<14"
  - "nltk>=3.8,<4"
# Settings the Hermes desktop app renders as a form (Settings ▸ Plugins ▸ Antemuse,
# from this schema) and writes to plugins.entries.antemuse.settings.<key>.
# A setting may change how loud or how long a state is; it may not change what a state is.
config_schema:
  recommend_enabled:
    type: bool
    default: true
    label: Recommend states
    description: >-
      Let the plugin suggest a state when the shape of the work has a name (a loop,
      a data wall, a long stretch). Off means silence: nothing is suggested, ever.
  recommend_cooling_minutes:
    type: int
    default: 45
    min: 10
    max: 240
    label: Minutes between recommendations
    description: >-
      How long one recommendation holds before another may replace it. Below 10 is
      clamped to 10, above 240 to 240: a plugin that speaks every turn is a nag.
  suggest_autofollow:
    type: bool
    default: false
    label: Follow suggestions automatically
    description: >-
      When the plugin suggests a state, enter it instead of only saying so. Off by
      default: a suggestion is advice, and the person decides whether to act on it.
      A followed state still ends by its dose, and nothing about the move changes.
  long_stretch_minutes:
    type: int
    default: 0
    min: 0
    max: 360
    label: Long-stretch threshold
    description: >-
      Minutes without a state before one is recommended. 0 keeps the measured
      threshold (the 75th percentile of your own stretches, clamped 60-180).
      Any other value overrides it, and the line says "fixed at N".
  journal_cap:
    type: int
    default: 60
    min: 20
    max: 60
    label: Journal entries kept
    description: >-
      How many journal entries the state keeps. Reduce only: values above 60 are
      clamped to 60, and below 20 to 20.
provides_tools:
  - state
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - transform_llm_output
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - on_session_delete
