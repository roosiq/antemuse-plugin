name: antemuse
label: Antemuse
kind: standalone
manifest_version: 2
version: "0.12.8"
author: Antemuse
homepage: https://antemuse.com
license: MIT
tags: [state, cognition, workflow, creativity]
platforms: [linux, macos, windows]
description: "Five short agent states, one at a time: walk, daydream, doomscroll, dream, unstuck. /walk takes 6 hops across the concept map and comes back with the path while your work keeps going. /daydream puts two things you said side by side. /doomscroll pulls 3 posts from public feeds. /dream mixes up your day. /unstuck suggests one next move from your day and the map. /explore is the map you fly yourself. No model calls on the state path. What it reads: daydream reads this chat's own recent messages. Dream and unstuck read this chat's own day - your messages and concepts the plugin served - and use local git commit subjects when the chat is in a repository. Doomscroll feed text is untrusted and never saved. A read-only scan of the last 14 days of sessions is controlled by the `session_scan` setting. What it keeps: a 60-entry state journal whose text is cut to 800 characters per entry, holding the material a state served and its closing account - for daydream, dream and unstuck that is drawn from what you said in this chat - plus at most 24 of your recent turns per chat at 400 characters each, for the last 8 chats. Feed text is never kept."
requires_hermes: ">=0.21.6"
python_dependencies:
  - "nltk>=3.8,<4"
# Settings the Hermes desktop app renders as a form (Settings ▸ Plugins ▸ Antemuse,
# from this schema) and writes to plugins.entries.antemuse.settings.<key>.
# A setting may change how loud or how long a state is; it may not change what a state is.
config_schema:
  recommend_enabled:
    type: bool
    default: true
    label: Recommend states
    description: >-
      Let the plugin suggest a state when your work looks stuck — going in circles,
      hitting a wall, or grinding on too long. Off means it never suggests anything.
  show_recommendations:
    type: bool
    default: false
    label: Show recommendations
    description: >-
      Show a suggested state when your work looks stuck — going in circles, hitting a
      wall, or grinding on too long. Off by default: it still keeps track either way,
      but says nothing to you and offers nothing to the agent. state(action="break")
      still works and still names no state unless this is on.
  recommend_cooling_turns:
    type: int
    default: 10
    min: 2
    max: 60
    label: Turns between recommendations
    description: >-
      How many messages a suggestion stays up before another can replace it. Counted in
      messages, not minutes. Below 2 is clamped to 2, above 60 to 60 — a plugin that
      speaks every message is a nag.
  suggest_autofollow:
    type: bool
    default: false
    label: Follow suggestions automatically
    description: >-
      When the plugin suggests a state, start it instead of just saying so. Off by
      default: a suggestion is advice and you decide. A state started this way still
      ends the same way.
  long_stretch_turns:
    type: int
    default: 0
    min: 0
    max: 200
    label: Long-stretch threshold
    description: >-
      How many messages without a state before one gets suggested. 0 keeps the measured
      threshold (the 75th percentile of your own stretches, clamped 15-80). Any other
      number overrides it, and the line says "fixed at N".
  journal_cap:
    type: int
    default: 60
    min: 20
    max: 60
    label: Journal entries kept
    description: >-
      How many journal entries the state keeps. Reduce only: values above 60 are
      clamped to 60, and below 20 to 20.
  session_scan:
    type: bool
    default: true
    label: Read past sessions
    description: >-
      One limited read of the last 14 days of session text, once per session, in the
      background, so the walk avoids concepts you have already seen. It does not light
      up the map: `LIT` counts what the running state has served. Off means the plugin
      never opens the session store, and the walk may revisit ground you know.
provides_tools:
  - state
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - transform_llm_output
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - on_session_delete
