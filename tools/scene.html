<!doctype html><html><head><meta charset=utf-8><style>
html,body{margin:0;background:#0e0c0b;overflow:hidden}canvas{display:block}
</style></head><body><canvas id="c" width="240" height="140"></canvas>
<script>window.addEventListener("error",e=>{document.title="ERR "+e.message;});</script>
<script type="module">
const THREE = await import('./three.module.js');
const W = 240, H = 140;
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias: true});
renderer.setSize(W, H, false); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;

const params = new URLSearchParams(location.search);
const NAME = params.get('scene') || 'walk';
const F = parseFloat(params.get('f') || '0');
const N = parseFloat(params.get('n') || '12');
const t = (F / N) * Math.PI * 2;      // one seamless loop

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(40, W / H, 0.1, 200);

function light(hex, i, x, y, z, dist = 60) {
  const l = new THREE.PointLight(hex, i, dist); l.position.set(x, y, z); scene.add(l); return l;
}
function bg(hex) { scene.background = new THREE.Color(hex); }

// ---------------------------------------------------------------- walk
function walk() {
  bg(0x0a0c10);
  scene.fog = new THREE.Fog(0x0a0c10, 8, 34);
  light(0x6fb3a8, 90, 0, 5, -2, 40);
  light(0xe8a33d, 26, 0, 0.4, 12, 30);
  cam.position.set(0, 1.5, 6.5); cam.lookAt(0, 0.6, -8);

  const grid = new THREE.GridHelper(60, 30, 0x22403f, 0x12201f);
  grid.position.y = -0.01; scene.add(grid);

  // the ground catches the light so the walk has a floor, not a void
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 60),
    new THREE.MeshBasicMaterial({color: 0x0d1417, transparent: true, opacity: 0.9}));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -0.02; scene.add(floor);

  const pts = [];
  for (let i = 0; i < 90; i++) pts.push(Math.sin(i * 0.55) * 0.55, 0, -i * 0.55);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    color: 0xbdf1e4, size: 0.34, transparent: true, opacity: 1.0,
    depthWrite: false, blending: THREE.AdditiveBlending
  })));

  const ring = new THREE.Mesh(new THREE.TorusGeometry(3.2, 0.05, 12, 160),
    new THREE.MeshBasicMaterial({color: 0xe8a33d}));
  ring.position.set(0, 1.5, -20); scene.add(ring);

  // a wide luminous path on the ground: the walk has somewhere to go
  const path = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 34),
    new THREE.MeshBasicMaterial({color: 0x2f7d74, transparent: true, opacity: 0.28,
                                 blending: THREE.AdditiveBlending, depthWrite: false}));
  path.rotation.x = -Math.PI / 2; path.position.set(0, 0.01, -10); scene.add(path);

  // the sun it walks toward
  const sun = new THREE.Mesh(new THREE.CircleGeometry(1.5, 48),
    new THREE.MeshBasicMaterial({color: 0xf2b25a}));
  sun.position.set(0, 1.5, -20); scene.add(sun);
  const halo = new THREE.Mesh(new THREE.CircleGeometry(4.2, 48),
    new THREE.MeshBasicMaterial({color: 0xe8a33d, transparent: true, opacity: 0.16,
                                 blending: THREE.AdditiveBlending, depthWrite: false}));
  halo.position.set(0, 1.5, -20.2); scene.add(halo);

  // a low glow on the horizon line the walk heads toward
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(18, 1.6),
    new THREE.MeshBasicMaterial({color: 0xe8a33d, transparent: true, opacity: 0.10,
                                 blending: THREE.AdditiveBlending, depthWrite: false}));
  glow.position.set(0, 0.55, -19.8); scene.add(glow);

  // a walking figure in silhouette against the light: the subject the scene lacked
  const figure = new THREE.Group();
  const dark = new THREE.MeshBasicMaterial({color: 0x05070a});
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.14, 0.46, 6, 14), dark);
  torso.position.y = 0.98; figure.add(torso);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.115, 24, 18), dark);
  head.position.y = 1.36; figure.add(head);
  const limb = (x, y, len, phase) => {
    const m = new THREE.Mesh(new THREE.CapsuleGeometry(0.045, len, 4, 10), dark);
    m.position.set(x, y, 0);
    m.userData.phase = phase;
    figure.add(m); return m;
  };
  const legL = limb(-0.07, 0.44, 0.34, 0);
  const legR = limb(0.07, 0.44, 0.34, Math.PI);
  const armL = limb(-0.19, 1.02, 0.28, Math.PI);
  const armR = limb(0.19, 1.02, 0.28, 0);
  figure.position.set(0, 0, 1.8);
  figure.rotation.y = Math.PI;                 // walking away, toward the light
  scene.add(figure);
  const swing = Math.sin(t * 2) * 0.45;
  legL.rotation.x = swing; legR.rotation.x = -swing;
  armL.rotation.x = -swing * 0.7; armR.rotation.x = swing * 0.7;
  figure.position.y = Math.abs(Math.sin(t * 2)) * 0.03;

  cam.position.x = Math.sin(t) * 0.18;          // the body drifts as it walks
  grid.position.z = (t * 0.05) % 1;
}

// ------------------------------------------------------------ daydream
function daydream() {
  bg(0x100d0c);
  scene.fog = new THREE.Fog(0x100d0c, 10, 40);
  light(0xe8a33d, 55, -3, 4, 4, 45);
  light(0x6fb3a8, 40, 4, -3, 2, 45);
  cam.position.set(0, 1.0, 7); cam.lookAt(0, 0.2, 0);

  const blob = new THREE.IcosahedronGeometry(1, 1);
  for (let i = 0; i < 7; i++) {
    const m = new THREE.Mesh(blob, new THREE.MeshStandardMaterial({
      color: i % 2 ? 0x8a6a3f : 0x50756e, roughness: 0.9, metalness: 0.05,
      transparent: true, opacity: 0.34, flatShading: true
    }));
    const a = (i / 7) * Math.PI * 2;
    m.position.set(Math.cos(a) * 2.6, Math.sin(a * 1.7) * 1.3, Math.sin(a) * 1.4 - 1);
    m.scale.setScalar(0.8 + (i % 3) * 0.35);
    m.userData.phase = i;
    scene.add(m);
    m.onBeforeRender = () => {
      const p = m.userData.phase;
      m.position.y += Math.sin(t + p * 1.1) * 0.012;
      m.position.x += Math.cos(t * 0.7 + p) * 0.010;
      m.rotation.y = t * 0.2 + p;
      m.rotation.x = Math.sin(t + p) * 0.3;
    };
  }
  cam.position.z = 7 - Math.sin(t * 0.5) * 0.4;
}

// ---------------------------------------------------------- dissociate
function dissociate() {
  bg(0x080a0c);
  scene.fog = new THREE.Fog(0x080a0c, 12, 45);
  light(0x9fb6c4, 45, 2, 3, 4, 40);
  cam.position.set(0, 0, 9); cam.lookAt(0, 0, 0);

  const geo = new THREE.TorusKnotGeometry(0.9, 0.22, 160, 20, 2, 3);
  const solid = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: 0x2a3438, roughness: 0.5, metalness: 0.3, emissive: 0x0d181c, emissiveIntensity: 1
  }));
  scene.add(solid);
  const ghost = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    color: 0x6fb3a8, wireframe: true, transparent: true, opacity: 0.45
  }));
  scene.add(ghost);

  const gap = 1.15 + Math.sin(t) * 0.35;
  solid.position.x = -gap; ghost.position.x = gap;
  solid.rotation.y = t * 0.18; ghost.rotation.y = -t * 0.18;
  solid.rotation.z = 0.15; ghost.rotation.z = -0.15;
  cam.position.x = Math.sin(t * 0.5) * 0.5;
}

// --------------------------------------------------------------- dream
function dream() {
  bg(0x0b0a12);
  scene.fog = new THREE.Fog(0x0b0a12, 9, 36);
  light(0x8f7bd6, 45, -3, 2, 4, 40);
  light(0xe8a33d, 35, 3, -2, 3, 40);
  cam.position.set(0, 0.6, 7.4); cam.lookAt(0, 0, 0);

  const mk = (hex, x) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(1.15, 48, 32),
      new THREE.MeshStandardMaterial({
        color: hex, roughness: 0.25, metalness: 0.1,
        transparent: true, opacity: 0.55, emissive: hex, emissiveIntensity: 0.25
      }));
    m.position.x = x; scene.add(m); return m;
  };
  const a = mk(0x6f5ab0, -0.95), b = mk(0xc08a43, 0.95);
  const merge = Math.sin(t) * 0.5 + 0.5;          // separate -> overlap -> separate
  a.position.x = -0.95 + merge * 0.55;
  b.position.x = 0.95 - merge * 0.55;
  a.position.y = Math.sin(t * 2) * 0.06;
  b.position.y = Math.cos(t * 2) * 0.06;

  const N2 = 300, pos = new Float32Array(N2 * 3);
  for (let i = 0; i < N2; i++) {
    const r = 1.6 + Math.random() * 1.6, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.cos(ph);
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const dust = new THREE.Points(pg, new THREE.PointsMaterial({
    color: 0xcfc4ff, size: 0.035, transparent: true, opacity: 0.75
  }));
  scene.add(dust); dust.rotation.y = t * 0.12;
}

// ---------------------------------------------------------- doomscroll
function doomscroll() {
  bg(0x0d0706);
  scene.fog = new THREE.Fog(0x0d0706, 6, 26);
  light(0xd2603f, 40, 0, 0, 5, 40);
  cam.position.set(0, 0, 5.2); cam.lookAt(0, 0, -6);
  cam.rotation.z = 0.035;                       // the slight tilt of a phone held too long

  const speed = 1.2 + (Math.sin(t) * 0.5 + 0.5) * 2.2;
  const card = (i) => {
    const g = new THREE.Group();
    const mat = new THREE.MeshBasicMaterial({
      color: 0x1a0f0c, transparent: true, opacity: 0.96
    });
    const body = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 1.9), mat);
    g.add(body);
    const edge = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 1.9),
      new THREE.MeshBasicMaterial({color: 0xd2603f, wireframe: true,
        transparent: true, opacity: 0.55 - i * 0.015}));
    g.add(edge);
    // the "content": a header bar and lines of text, blurred into blocks
    const hdr = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 0.16),
      new THREE.MeshBasicMaterial({color: 0xe8a33d, transparent: true, opacity: 0.55}));
    hdr.position.set(-0.35, 0.66, 0.01); g.add(hdr);
    for (let r = 0; r < 5; r++) {
      const wline = 1.6 + ((i * 3 + r * 7) % 9) * 0.13;
      const line = new THREE.Mesh(new THREE.PlaneGeometry(wline, 0.07),
        new THREE.MeshBasicMaterial({color: 0xc9a898, transparent: true, opacity: 0.30}));
      line.position.set(-0.35 + (2.2 - wline) * 0.5 - 1.1 + wline / 2, 0.42 - r * 0.21, 0.01);
      g.add(line);
    }
    return g;
  };

  const N3 = 14;
  for (let i = 0; i < N3; i++) {
    const g = card(i);
    const z = ((i * 1.75 - t * speed * 2.2) % 20 + 20) % 20;
    g.position.set(0, 0, -z + 1.2);
    g.rotation.y = (Math.sin(i * 2.1) * 0.04);
    const fade = Math.max(0.05, 1 - z / 20);
    g.scale.setScalar(0.6 + fade * 0.95);
    g.traverse(o => { if (o.material) o.material.transparent = true; });
    scene.add(g);
  }
}

({walk, daydream, dissociate, dream, doomscroll}[NAME] || walk)();
renderer.render(scene, cam);
</script></body></html>
