<!doctype html><html><head><meta charset=utf-8><style>
html,body{margin:0;background:#0e0c0b;overflow:hidden}canvas{display:block}
</style></head><body><canvas id="c"></canvas>
<script>window.addEventListener("error",e=>{document.title="ERR "+e.message;});</script>
<script type="module">
const THREE = await import('./three.module.js');
const W = Math.max(320, window.innerWidth || 960);
const H = Math.max(180, window.innerHeight || 540);
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias: true});
renderer.setSize(W, H, false); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 2.05;

const params = new URLSearchParams(location.search);
const NAME = params.get('scene') || 'walk';
const F = parseFloat(params.get('f') || '0');
const N = parseFloat(params.get('n') || '12');
const t = (F / N) * Math.PI * 2;      // one seamless loop

// A bake must be reproducible from its key alone, so nothing here may call
// Math.random(). Same seed, same frame, same glyphs.
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let x = Math.imul(a ^ (a >>> 15), 1 | a);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
const SEED = parseInt(params.get('seed') || '7', 10);
const rnd = mulberry32(SEED);

// A real asset, scaled to a stated longest side and re-centred on its own box, so
// a mesh in centimetres and a mesh in metres land the same size in scene units.
async function wire(url, longest, color, opacity = 0.9) {
  const { loadGLB } = await import('./glb_mesh.js');
  const mat = new THREE.MeshBasicMaterial({ color, wireframe: true, transparent: true, opacity });
  const mesh = await loadGLB(url, THREE, mat);
  const box = new THREE.Box3().setFromObject(mesh);
  const size = new THREE.Vector3(); box.getSize(size);
  const centre = new THREE.Vector3(); box.getCenter(centre);
  const s = longest / Math.max(size.x, size.y, size.z);
  mesh.scale.setScalar(s);
  mesh.position.set(-centre.x * s, -centre.y * s, -centre.z * s);
  const wrap = new THREE.Group();
  wrap.add(mesh);
  return wrap;
}

async function prop(url, longest, material) {
  const { loadGLB } = await import('./glb_mesh.js');
  const mesh = await loadGLB(url, THREE, material);
  const box = new THREE.Box3().setFromObject(mesh);
  const size = new THREE.Vector3(); box.getSize(size);
  const centre = new THREE.Vector3(); box.getCenter(centre);
  const s = longest / Math.max(size.x, size.y, size.z);
  mesh.scale.setScalar(s);
  mesh.position.set(-centre.x * s, -centre.y * s, -centre.z * s);
  const wrap = new THREE.Group();
  wrap.add(mesh);
  return wrap;
}

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(40, W / H, 0.1, 200);

function light(hex, i, x, y, z, dist = 60) {
  const l = new THREE.PointLight(hex, i, dist); l.position.set(x, y, z); scene.add(l); return l;
}
function bg(hex) { scene.background = new THREE.Color(hex); }

// ---------------------------------------------------------------- walk
// A form walking a lattice: a stellated solid drifting away over a glowing grid
// toward a torus gateway. No figure, no path, no place that exists.
async function walk() {
  bg(0x05070a);
  scene.fog = new THREE.Fog(0x05070a, 10, 46);
  light(0x9fe8ff, 60, -4, 5, 3, 55);
  light(0xff9d4d, 35, 3, 1, -6, 60);

  const chrome = new THREE.MeshStandardMaterial({ color: 0xb9c6d2, roughness: 0.28, metalness: 0.8, emissive: 0x0a1418, emissiveIntensity: 1 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x2a3340, roughness: 0.6, metalness: 0.4, emissive: 0x0d3a45, emissiveIntensity: 1.1 });
  const neon = new THREE.MeshStandardMaterial({ color: 0x1b2b33, roughness: 0.4, metalness: 0.6, emissive: 0x2fd8ff, emissiveIntensity: 1.4 });

  const ground = await wire('/data/meshy/pack/walk/lattice_plane.glb', 16, 0x1b4b57, 0.18);
  ground.position.set(0, -2.3, -7);
  scene.add(ground);

  const gate = await wire('/data/meshy/pack/walk/gateway_torus.glb', 9.5, 0x1f6f8f, 0.32);
  gate.position.set(0, 1.9, -19);
  scene.add(gate);

  const pilgrim = await wire('/data/meshy/pack/walk/pilgrim_star.glb', 2.8, 0xcfd9e2, 0.85);
  pilgrim.position.set(0, 0.9, 2.2);
  pilgrim.rotation.y = Math.PI;
  scene.add(pilgrim);

  
  // one deliberate motion: the construct steps away, the ring holds still
  pilgrim.rotation.y = Math.PI + Math.sin(t) * 0.16;
  pilgrim.position.y = 0.9 + Math.abs(Math.sin(t * 2)) * 0.06;
  pilgrim.position.z = 2.2 - (Math.sin(t) * 0.5 + 0.5) * 0.9;
  cam.position.set(Math.sin(t) * 0.18, 2.1, 8.4);
  cam.lookAt(0, 1.2, -3);
}

// ------------------------------------------------------------ daydream
// A faceted mass and a ribbon that passes behind it. Two exact shapes, one thin,
// one heavy: the gap between them is the memory, so they never merge.
async function daydream() {
  bg(0x0a0816);
  scene.fog = new THREE.Fog(0x0a0816, 14, 44);
  light(0xa78dff, 40, -4, 4, 6, 50);
  light(0x53d9c8, 26, 4, -3, 2, 50);

  const [mass, ribbon] = await Promise.all([
    wire('/data/meshy/pack/daydream/dodecahedron.glb', 3.4, 0xcfc4f2, 0.85),
    wire('/data/meshy/pack/daydream/mobius_ribbon.glb', 5.2, 0x4fd8c8, 0.5)
  ]);
  mass.position.set(-1.35, 0.1, 0.4);
  ribbon.position.set(1.5, -0.2, -1.4);
  ribbon.rotation.set(0.5, 0.3, 0.2);
  scene.add(mass, ribbon);

  const drift = Math.sin(t) * 0.5 + 0.5;
  mass.rotation.y = t * 0.22; mass.rotation.x = 0.18 + Math.sin(t) * 0.06;
  mass.position.x = -1.35 - drift * 0.35;
  ribbon.rotation.z = 0.2 + Math.sin(t * 0.8) * 0.35;
  ribbon.position.y = -0.2 + drift * 0.5;
  cam.position.set(0, 0.3, 6.8);
  cam.lookAt(0, 0.0, -0.3);
}

// ---------------------------------------------------------- dissociate
function dissociate() {
  bg(0x080a0c);
  scene.fog = new THREE.Fog(0x080a0c, 12, 45);
  light(0x9fb6c4, 45, 2, 3, 4, 40);
  cam.position.set(0, 0, 9); cam.lookAt(0, 0, 0);

  const geo = new THREE.TorusKnotGeometry(0.9, 0.22, 160, 20, 2, 3);
  const solid = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: 0x2a3438, roughness: 0.5, metalness: 0.3, emissive: 0x0d181c, emissiveIntensity: 1
  }));
  scene.add(solid);
  const ghost = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    color: 0x6fb3a8, wireframe: true, transparent: true, opacity: 0.45
  }));
  scene.add(ghost);

  const gap = 1.15 + Math.sin(t) * 0.35;
  solid.position.x = -gap; ghost.position.x = gap;
  solid.rotation.y = t * 0.18; ghost.rotation.y = -t * 0.18;
  solid.rotation.z = 0.15; ghost.rotation.z = -0.15;
  cam.position.x = Math.sin(t * 0.5) * 0.5;
}

// --------------------------------------------------------------- dream
// An impossible object from classical mathematics, with its own negation beside
// it: the tesseract, and a knot that cannot be untied.
async function dream() {
  bg(0x080611);
  scene.fog = new THREE.Fog(0x080611, 12, 44);
  light(0x8f7bd6, 50, -3, 2, 4, 45);
  light(0xffb066, 40, 3, -2, 3, 45);
  scene.add(new THREE.AmbientLight(0x241d3a, 1.5));

  const steel = new THREE.MeshStandardMaterial({ color: 0xc3c8d6, roughness: 0.3, metalness: 0.85, emissive: 0x0d0a18, emissiveIntensity: 1 });
  const gold = new THREE.MeshStandardMaterial({ color: 0xd8b06a, roughness: 0.35, metalness: 0.9, emissive: 0x1a1206, emissiveIntensity: 1 });

  const [cube, knot] = await Promise.all([
    wire('/data/meshy/pack/dream/tesseract_frame.glb', 3.6, 0xd6cdea, 0.8),
    wire('/data/meshy/pack/dream/trefoil_solid.glb', 2.7, 0xb98a3f, 0.42)
  ]);
  cube.position.set(-1.15, 0.25, 0);
  knot.position.set(1.35, -0.25, -0.5);
  scene.add(cube, knot);

  const merge = Math.sin(t) * 0.5 + 0.5;
  cube.rotation.y = t * 0.16; cube.rotation.x = 0.25 + Math.sin(t) * 0.08;
  knot.rotation.y = -t * 0.22; knot.rotation.z = 0.2;
  cube.position.x = -1.15 + merge * 0.3;
  knot.position.x = 1.35 - merge * 0.3;
  cam.position.set(0, 0.5, 7.6);
  cam.lookAt(0, 0.0, 0);
}

// ---------------------------------------------------------- doomscroll
// Plates receding down a corridor, seen from inside it: a feed passing the lens.
// Front faces, no wheel — the depth is the point, so nothing orbits.
async function doomscroll() {
  bg(0x05070a);
  scene.fog = new THREE.Fog(0x05070a, 9, 52);
  light(0xffb060, 30, 0, 2, 5, 40);

  const sources = [
    '/data/meshy/pack/doomscroll/engraved_slab.glb',
    '/data/meshy/pack/doomscroll/glyph_panel.glb',
    '/data/meshy/pack/doomscroll/plate_stack.glb',
    '/data/meshy/pack/doomscroll/prism_bar.glb',
    '/data/meshy/pack/doomscroll/tessellated_block.glb'
  ];
  const loaded = await Promise.all(sources.map((src) => wire(src, 3.0, 0x76848f, 0.3)));

  // explicit plate placement: one near face carrying the frame, the rest stepping away
  const PLACES = [
    { z: -2.2, x: 0.0, y: 0.0, s: 2.6, o: 0.9, c: 0xc6d2dc },
    { z: -6.4, x: -1.5, y: 0.5, s: 1.2, o: 0.5, c: 0x8a97a4 },
    { z: -9.8, x: 1.4, y: -0.6, s: 1.1, o: 0.45, c: 0x2f7f96 },
    { z: -13.6, x: -0.8, y: 0.9, s: 1.0, o: 0.38, c: 0x8a97a4 },
    { z: -18.0, x: 0.6, y: -0.3, s: 0.95, o: 0.3, c: 0x2f7f96 }
  ];
  const plates = [];
  PLACES.forEach((place, i) => {
    const mesh = loaded[i % loaded.length].clone(true);
    mesh.material = new THREE.MeshBasicMaterial({
      color: place.c, wireframe: true, transparent: true, opacity: place.o
    });
    mesh.position.set(place.x, place.y, place.z);
    mesh.rotation.set((rnd() - 0.5) * 0.1, (rnd() - 0.5) * 0.16, (rnd() - 0.5) * 0.08);
    mesh.scale.multiplyScalar(place.s);
    scene.add(mesh);
    plates.push({ mesh, depth: place.z, span: 24 });
  });

  const SPAN = 24;
  for (const plate of plates) {
    plate.mesh.position.z = ((plate.depth + (t / (Math.PI * 2)) * SPAN) % SPAN);
    if (plate.mesh.position.z > 3.4) plate.mesh.position.z -= SPAN;
  }
  cam.position.set(0, 0, 4.6);
  cam.lookAt(0, 0, -3.0);
}

await ({walk, daydream, dissociate, dream, doomscroll}[NAME] || walk)();

// Every scene is composed for a wide letterbox because the chat card is wide. A
// pane is closer to square, and a square viewport does not merely crop: the camera
// aspect changes and the composition moves. These are the same scenes re-framed,
// not crops of the wide bake.
const AR = innerWidth / innerHeight;
const SQUARE = {
  walk:      () => { cam.position.set(0, 1.25, 4.6); cam.lookAt(0, 1.05, 0); },
  daydream:  () => { cam.position.set(0, 0.1, 5.4);   cam.lookAt(0, -0.55, 0); },
  doomscroll:() => { cam.position.set(0, 0, 5.6);    cam.lookAt(0, 0, -6.0); },
  dream:     () => { cam.position.set(0, 0.1, 4.9);  cam.lookAt(0, -0.7, 0); }
};
if (AR < 1.3 && SQUARE[NAME]) SQUARE[NAME]();
renderer.render(scene, cam);
</script></body></html>
