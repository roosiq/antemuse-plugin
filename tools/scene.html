<!doctype html><html><head><meta charset=utf-8><style>
html,body{margin:0;background:#0e0c0b;overflow:hidden}canvas{display:block}
#err{position:fixed;left:0;top:0;color:#000;font:10px monospace;background:#0e0c0b}
</style></head><body><pre id="err"></pre><canvas id="c" width="240" height="140"></canvas>
<script type="module">
const log=(m)=>{document.getElementById('err').textContent += m + "\n";};
try{
  const THREE = await import('./three.module.js');
  const W=240,H=140;
  const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
  renderer.setSize(W,H,false); renderer.setPixelRatio(1);
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.45;
  const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0e0c0b);
  const cam=new THREE.PerspectiveCamera(38,W/H,0.1,100); cam.position.set(0,1.3,5.0); cam.lookAt(0,0,0);
  scene.add(new THREE.AmbientLight(0xffffff,0.6));
  const key=new THREE.PointLight(0xe8a33d,110,50); key.position.set(2.4,3.2,3.4); scene.add(key);
  const rim=new THREE.PointLight(0x6fb3a8,70,50); rim.position.set(-3,-1.6,-2.6); scene.add(rim);
  const grp=new THREE.Group(); scene.add(grp);
  const knot=new THREE.Mesh(new THREE.TorusKnotGeometry(1.0,0.28,200,26,2,3),
    new THREE.MeshStandardMaterial({color:0xb08a63,roughness:0.35,metalness:0.25}));
  grp.add(knot);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.8,0.012,8,200),
    new THREE.MeshBasicMaterial({color:0xe8a33d}));
  ring.rotation.x=Math.PI/2.35; scene.add(ring);
  const N=380,pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){const r=1.9+Math.random()*1.4,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(p)*Math.cos(t);pos[i*3+1]=r*Math.cos(p)*0.6;pos[i*3+2]=r*Math.sin(p)*Math.sin(t);}
  const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(pg,new THREE.PointsMaterial({size:0.035,color:0x6fb3a8,transparent:true,opacity:0.9})));
  const f=parseFloat(location.hash.slice(1)||'0');
  grp.rotation.y=f*0.16; grp.rotation.x=0.22+Math.sin(f*0.10)*0.10;
  knot.rotation.z=f*0.05; ring.rotation.z=f*0.09;
  renderer.render(scene,cam);
  log('ok f'+f);
}catch(e){ log('ERR '+(e&&e.message)); }
</script></body></html>
