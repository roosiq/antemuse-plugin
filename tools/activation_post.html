<!doctype html>
<!-- Activation stills, post-processed by three.js at bake time.
     The plugin never imports three: this page runs in headless Chromium, reads one still,
     and writes the same picture back with bloom, a little chromatic separation, grain and a
     vignette. Post-processing is a look, not information — nothing is added to the picture.

     tools/postprocess_activation.py drives it. Query: ?src=<url>&w=&h= -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #060608; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three-bake/three.module.js" } }
</script>
</head>
<body>
<script type="module">
const fail = (msg) => { document.title = 'error: ' + msg; console.error(msg) }

try {
  const THREE = await import('three')
  const { EffectComposer } = await import('../vendor/three-bake/postprocessing/EffectComposer.js')
  const { RenderPass } = await import('../vendor/three-bake/postprocessing/RenderPass.js')
  const { ShaderPass } = await import('../vendor/three-bake/postprocessing/ShaderPass.js')
  const { UnrealBloomPass } = await import('../vendor/three-bake/postprocessing/UnrealBloomPass.js')
  const { OutputPass } = await import('../vendor/three-bake/postprocessing/OutputPass.js')
  const { RGBShiftShader } = await import('../vendor/three-bake/shaders/RGBShiftShader.js')

  const params = new URLSearchParams(location.search)
  const w = parseInt(params.get('w') || '960', 10)
  const h = parseInt(params.get('h') || '600', 10)
  const src = params.get('src')
  // The look is tunable without editing the page: ?grain=&vignette=&bloom=
  const num = (name, fallback) => {
    const raw = params.get(name)
    const value = raw === null ? NaN : parseFloat(raw)
    return Number.isFinite(value) ? value : fallback
  }
  const grainAmount = num('grain', 0.022)
  const vignetteAmount = num('vignette', 0.45)
  const bloomAmount = num('bloom', 0.55)

  const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true })
  renderer.setPixelRatio(1)
  renderer.setSize(w, h)
  renderer.setClearColor(0x060608, 1)
  document.body.appendChild(renderer.domElement)

  const scene = new THREE.Scene()
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1)

  // The still as a textured quad. It is the only content: the passes below change how it
  // looks, not what it says.
  const texture = await new Promise((resolve, reject) => {
    const loader = new THREE.TextureLoader()
    loader.load(src, (t) => { t.colorSpace = THREE.SRGBColorSpace; resolve(t) }, undefined,
      () => reject(new Error('texture failed: ' + src)))
  })
  const quad = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 2),
    new THREE.MeshBasicMaterial({ map: texture })
  )
  scene.add(quad)

  const composer = new EffectComposer(renderer)
  composer.setSize(w, h)
  composer.addPass(new RenderPass(scene, camera))

  const bloom = new UnrealBloomPass(new THREE.Vector2(w, h), bloomAmount, 0.62, 0.10)
  composer.addPass(bloom)

  const shift = new ShaderPass(RGBShiftShader)
  shift.uniforms.amount.value = 0.0016
  composer.addPass(shift)

  // Grain and vignette in one cheap pass: a state picture should feel photographed, not plotted.
  const GrainVignette = {
    uniforms: {
      tDiffuse: { value: null },
      time: { value: 0 },
      grain: { value: grainAmount },
      vignette: { value: vignetteAmount }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
    `,
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform float time; uniform float grain; uniform float vignette;
      varying vec2 vUv;
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      void main() {
        vec4 c = texture2D(tDiffuse, vUv);
        float n = hash(vUv * 1024.0 + time) - 0.5;
        vec2 d = vUv - 0.5;
        float v = smoothstep(0.92, 0.28, length(d) * 1.18);
        c.rgb = c.rgb * mix(1.0, v, vignette) + n * grain;
        gl_FragColor = c;
      }
    `
  }
  const grain = new ShaderPass(GrainVignette)
  grain.uniforms.time.value = 7.0
  composer.addPass(grain)

  composer.addPass(new OutputPass())

  composer.render()
  document.title = 'ready'
} catch (e) {
  fail((e && e.message) || String(e))
}
</script>
</body>
</html>
