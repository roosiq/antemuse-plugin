name: antemuse
repo: https://github.com/roosiq/antemuse-plugin
sha: ff1d515842c32362c89db75437463181416d66b4
description: >-
  Deliberate, bounded changes to how the agent works — walk, daydream, doomscroll,
  unstuck and dream — each with a duration, a turn budget, a reply contract, and
  wordless imagery for the person while the model gets text. The host, not the
  model, enforces the state: an entry can close tools (block: true) and a blocked
  tool call never runs; states end on their dose or the clock without a model call;
  /return produces an account built from the journal and keeps the residue. A
  recommendation line arrives inside the turn, only when a counter justifies it
  (minutes, turns, repeated failed calls), and names that counter. Disclosure —
  doomscroll fetches public RSS/JSON feeds over urllib (8 s timeout, no credentials)
  and places feed text in the agent's context; daydream reads the operator's
  ~/.hermes/memories/{MEMORY,USER}.md, and session-scan reads up to 300 recent
  messages from ~/.hermes/state.db once per session in a background thread
  (ANTEMUSE_NO_SCAN disables it). Writes go to the profile plugin data dir and
  <repo>/.antemuse/ only. The terminal takeover may spawn node to rasterise live
  scenes. Dev-only scripts under tools/ make network calls and are never imported
  at registration. No credentials, no telemetry, no self-updater, and no model call
  on entry, exit, expiry or rendering.
maintainer: roosiq
tier: community
category: general
docs_url: https://github.com/roosiq/antemuse-plugin#readme
version: "0.9.0"
platforms: [linux, macos]
capabilities:
  provides_tools: ["state"]
  provides_hooks:
    - pre_llm_call
    - pre_tool_call
    - post_tool_call
    - transform_llm_output
    - on_session_end
    - on_session_finalize
    - on_session_reset
    - on_session_delete
  provides_middleware: []
  requires_env: []
