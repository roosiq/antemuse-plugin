known_issues:
- The picture is the desktop app's Antemuse pane only; chat carries no visualization, and a terminal gets
  the full-screen takeover.
- 'Windows: the installer and runtime are pure Python and the suite passes on Linux; the takeover needs
  a POSIX terminal and prints a still frame elsewhere.'
- The exploration library (spark, keep, collider, selection) is present but runtime-gated behind experimental.enabled
  and makes no quality claim.
