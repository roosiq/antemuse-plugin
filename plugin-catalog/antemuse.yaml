description: 'Five short agent states, one at a time: walk, daydream, doomscroll, dream, unstuck. /walk
  takes 6 hops across the concept map and comes back with the path while your work keeps going. /daydream
  puts two things you said side by side. /doomscroll pulls 3 posts from public feeds. /dream mixes up
  your recent commits. /unstuck suggests one next move from your commits and the map. /explore is the
  map you fly yourself. No model calls on the state path. What it reads: daydream reads this chat''s own
  recent messages, dream and unstuck read local git commit subjects only, doomscroll feed text is untrusted
  and never saved. A read-only scan of the last 14 days of sessions is controlled by the `session_scan`
  setting.'
