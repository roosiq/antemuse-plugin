description: 'Five short agent states, one at a time: walk, daydream, doomscroll, dream, unstuck. /walk
  takes 6 hops across the concept map and comes back with the path while your work keeps going. /daydream
  puts two things you said side by side. /doomscroll pulls 3 posts from public feeds. /dream mixes up
  your day. /unstuck suggests one next move from your day and the map. /explore is the map you fly yourself.
  No model calls on the state path. What it reads: daydream and dream read this chat''s own recent messages
  and the concepts it was served, dream also reads local git commit subjects when the chat is in a repo,
  unstuck reads the same day record, and both use local git commit subjects only when the chat is in a
  repo, doomscroll feed text is untrusted and never saved. A read-only scan of the last 14 days of sessions
  is controlled by the `session_scan` setting.'
