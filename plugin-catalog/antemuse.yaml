disclosures:
- 'Network reads: doomscroll fetches public RSS/JSON feeds (8 s timeout, urllib, no credentials); results
  cached in the plugin data dir.'
- 'Reads outside the data dir: daydream reads the operator''s Hermes memory files; walks read local WordNet/FrameNet
  corpora via nltk.'
- 'Writes: active state record, journal, residue, cursor and render caches under the plugin data dir;
  per-project artifacts under <repo>/.antemuse/.'
- 'Child process: the full-screen takeover may spawn node to rasterise the live scene; it inherits no
  shell and falls back to cached frames when node is absent.'
- 'Dev-only tools: scripts under tools/ make network calls and spawn browsers; they are never imported
  by plugin registration.'
- 'Credentials: none requested, read, stored or refreshed.'
- 'Telemetry and model usage: none. No analytics, no hidden LLM calls on the state path.'
- 'Updates: the plugin never updates itself; updates arrive through this pinned SHA and ''hermes plugins
